<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="시민 버스 민원센터 회원가입">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>회원가입 | 시민 버스 민원센터</title>
    <link rel="stylesheet" href="../../static/css/signup.css" th:href="@{/css/signup.css}">
    <link rel="stylesheet" href="../../static/css/public-layout.css" th:href="@{/css/public-layout.css}">
    <script src="https://t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js" defer></script>
    <script src="../../static/js/signup.js" th:src="@{/js/signup.js}" defer></script>
    <script src="../../static/js/public-layout.js" th:src="@{/js/public-layout.js}" defer></script>
</head>
<body>
<a class="skip-link" href="#signup-main">회원가입 내용으로 바로가기</a>

<header th:replace="~{fragments/public-layout :: header}"></header>
<section th:replace="~{fragments/public-layout :: subHero('/images/subpages/signup-hero.png', '회원가입')}"></section>

<main id="signup-main" class="signup-page">
    <section class="signup-card" aria-labelledby="signup-title">
        <div class="title-area">
            <h1 id="signup-title">회원가입</h1>
            <span>민원 접수와 처리 현황을 편리하게 확인해 보세요.</span>
        </div>

        <form id="signup-form" class="signup-form" method="post"
              action="/signup" th:action="@{/signup}" th:object="${signupForm}" novalidate>
            <input type="hidden" th:if="${_csrf != null}"
                   th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input id="phone-verification-token" type="hidden"
                   th:field="*{phoneVerificationToken}">
            <div class="field">
                <label for="user-id">아이디 <em>필수</em></label>
                <div class="input-action-row">
                    <input id="user-id" name="empId" type="text" autocomplete="username" th:field="*{empId}"
                           placeholder="영문 소문자와 숫자 4~20자" minlength="4" maxlength="20"
                           pattern="[a-z0-9]{4,20}" required>
                    <button id="check-user-id" class="field-button" type="button">중복확인</button>
                </div>
                <p id="user-id-message" class="field-message" aria-live="polite"
                   th:errors="*{empId}"></p>
            </div>

            <div class="field">
                <label for="password">비밀번호 <em>필수</em></label>
                <div class="password-wrap">
                    <input id="password" name="empPassword" type="password" autocomplete="new-password"
                           placeholder="영문과 숫자를 포함하여 8자 이상" minlength="8" required>
                    <button class="password-toggle" type="button" data-target="password" aria-label="비밀번호 표시">보기</button>
                </div>
                <p class="field-message" aria-live="polite" th:errors="*{empPassword}"></p>
            </div>

            <div class="field">
                <label for="password-confirm">비밀번호 확인 <em>필수</em></label>
                <div class="password-wrap">
                    <input id="password-confirm" name="passwordConfirm" type="password" autocomplete="new-password"
                           placeholder="비밀번호를 다시 입력해 주세요" minlength="8" required>
                    <button class="password-toggle" type="button" data-target="password-confirm" aria-label="비밀번호 확인 표시">보기</button>
                </div>
                <p class="field-message" aria-live="polite" th:errors="*{passwordConfirm}"></p>
            </div>

            <div class="field">
                <label for="name">이름 <em>필수</em></label>
                <input id="name" name="empName" type="text" autocomplete="name" th:field="*{empName}"
                       placeholder="이름을 입력해 주세요" maxlength="30" required>
                <p class="field-message" aria-live="polite" th:errors="*{empName}"></p>
            </div>

            <div class="field">
                <label for="email">이메일 <em>필수</em></label>
                <input id="email" name="empEmail" type="email" autocomplete="email" th:field="*{empEmail}"
                       placeholder="example@email.com" maxlength="100" required>
                <p class="field-message" aria-live="polite" th:errors="*{empEmail}"></p>
            </div>

            <div class="field">
                <label for="phone">휴대전화 <em>필수</em></label>
                <div class="input-action-row">
                    <input id="phone" name="empPhone" type="tel" autocomplete="tel" inputmode="numeric"
                           th:field="*{empPhone}"
                           placeholder="숫자만 입력해 주세요" maxlength="11" pattern="01[0-9]{8,9}" required>
                    <button id="request-phone-code" class="field-button" type="button">인증번호 요청</button>
                </div>
                <p id="phone-message" class="field-message" aria-live="polite"
                   th:errors="*{empPhone}"></p>
            </div>

            <div id="phone-verification" class="field verification-field" hidden>
                <label for="phone-code">휴대전화 인증 <em>필수</em></label>
                <div class="input-action-row verification-row">
                    <div class="code-input-wrap">
                        <input id="phone-code" name="phoneCode" type="text" inputmode="numeric"
                               placeholder="인증번호 6자리" maxlength="6" pattern="[0-9]{6}">
                        <span id="verification-timer" class="timer">03:00</span>
                    </div>
                    <button id="verify-phone-code" class="field-button" type="button">인증확인</button>
                </div>
                <p id="phone-code-message" class="field-message" aria-live="polite"
                   th:errors="*{phoneVerificationToken}"></p>
            </div>

            <fieldset class="address-fieldset">
                <legend>주소 <em>필수</em></legend>
                <div class="input-action-row postcode-row">
                    <input id="postcode" name="postcode" type="text" placeholder="우편번호"
                           th:field="*{postcode}" readonly required>
                    <button id="search-address" class="field-button" type="button">주소 검색</button>
                </div>
                <input id="address" name="address" type="text" placeholder="기본 주소"
                       th:field="*{address}" readonly required>
                <input id="address-detail" name="addressDetail" type="text" autocomplete="street-address"
                       th:field="*{addressDetail}"
                       placeholder="상세 주소를 입력해 주세요" maxlength="100" required>
                <p id="address-message" class="field-message" aria-live="polite"
                   th:errors="*{addressDetail}"></p>
            </fieldset>

            <button class="submit-button" type="submit">회원가입</button>
            <p class="login-guide">이미 계정이 있으신가요? <a href="/login" th:href="@{/login}">로그인</a></p>
        </form>
    </section>
</main>
<footer th:replace="~{fragments/public-layout :: footer}"></footer>
</body>
</html>
