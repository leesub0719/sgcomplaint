spring.application.name=SGComplaint-JPA-Real-SMS
server.port=8080

# MySQL 접속 정보
# 환경변수가 없다면 기본값 bus_complaint_db / root / 빈 비밀번호를 사용합니다.
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME:bus_complaint_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 설정
# database/schema.sql을 먼저 실행한 후 테이블 구조를 검증합니다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# SOLAPI 실제 문자 발송 설정
# API Key/Secret과 등록된 발신번호는 환경변수로 전달합니다.
sms.solapi.api-key=${SOLAPI_API_KEY:}
sms.solapi.api-secret=${SOLAPI_API_SECRET:}
sms.solapi.sender=${SOLAPI_SENDER:}

# 인증번호 유효시간, 재발송 대기시간, 인증 성공 토큰 유효시간
sms.verification.code-expiration-seconds=180
sms.verification.resend-cooldown-seconds=60
sms.verification.token-expiration-seconds=600
sms.verification.max-failed-attempts=5

spring.thymeleaf.cache=false

# 민원 첨부파일 설정
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=52MB
app.upload.complaint-dir=${COMPLAINT_UPLOAD_DIR:uploads/complaints}
app.upload.answer-dir=${ANSWER_UPLOAD_DIR:uploads/answers}
app.upload.notice-image-dir=${NOTICE_IMAGE_UPLOAD_DIR:uploads/notices}
app.upload.main-banner-dir=${MAIN_BANNER_UPLOAD_DIR:uploads/main-banners}
